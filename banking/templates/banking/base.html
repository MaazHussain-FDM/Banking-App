<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Django Banking App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        nav a { margin-right: 1rem; }
        .messages { margin: 1rem 0; }
        .messages li { margin-bottom: 0.4rem; }
        .errorlist { color: #b00020; }
    </style>
</head>
<body>
<nav>
    {% if user.is_authenticated %}
        <a href="{% url 'account-detail' %}">Account</a>
        <a href="{% url 'deposit' %}">Deposit</a>
        <a href="{% url 'withdraw' %}">Withdraw</a>
        <a href="{% url 'transactions' %}">Transactions</a>
        <form style="display:inline;" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
    {% endif %}
</nav>

{% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
